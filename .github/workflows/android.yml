name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        env:
          LIVE_NEIS: "1"
        run: |
          set -o pipefail
          ./gradlew --no-daemon testWebDebugUnitTest testNativeDebugUnitTest -i 2>&1 | grep -E '@@LIVE|FAILED|BUILD|tests completed|^e: |error:|What went wrong|Exception|AssertionError'

      - name: 글자 위치 JSON 출력 (로그에서 원본 HTML 수치와 비교)
        if: always()
        run: |
          for f in app/build/screenshots/*.json; do
            [ -f "$f" ] || continue
            echo "@@JSON $(basename "$f" .json) $(tr -d '\n' < "$f")"
          done

      - name: 캡처 이미지를 로그로 출력 (아티팩트 다운로드가 막혀 있어 base64 로 수신)
        if: always()
        run: |
          for f in app/build/screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "@@PNG $(basename "$f" .png) $(base64 -w0 "$f")"
          done

      - name: Upload native screenshots (원본 HTML 과 비교용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-screenshots
          path: app/build/screenshots/*.png
          if-no-files-found: ignore

      - name: Build debug APKs (web + native)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mobilepass-web-debug-apk
          path: app/build/outputs/apk/web/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mobilepass-native-debug-apk
          path: app/build/outputs/apk/native/debug/*.apk
